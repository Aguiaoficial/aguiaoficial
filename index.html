        allow="clipboard-read; clipboard-write"
        title="app.aguiaoficial.com">
    </iframe>

    <!-- Container do Banner Recuável e Miniatura -->
    <div class="wa-container">
        <!-- Banner Aberto -->
        <div class="wa-card" id="wa-card">
            <div class="wa-header">
                <i class="fab fa-whatsapp"></i>
                <button id="wa-minimize" class="wa-minimize" aria-label="Minimizar">&times;</button>
            </div>
            <p class="wa-title">Grupo de palpites no WhatsApp</p>
            <a href="https://chat.whatsapp.com/KRE9RgS3P9XKvLs26yBInb?s=cl&p=a&mlu=4&ilr=4&iam=2" target="_blank" class="wa-btn">Entrar</a>
        </div>
        
        <!-- Miniatura (Exibida quando o banner é fechado) -->
        <div id="wa-mini" class="wa-mini hidden" title="Abrir opções do WhatsApp">
            <i class="fas fa-users"></i>
        </div>
    </div>

    <script>
        // Abrir em tela cheia automaticamente
        document.addEventListener('DOMContentLoaded', () => {
            const iframe = document.querySelector('iframe');
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.mozRequestFullScreen) { // Firefox
                iframe.mozRequestFullScreen();
            } else if (iframe.webkitRequestFullscreen) { // Chrome, Safari and Opera
                iframe.webkitRequestFullscreen();
            } else if (iframe.msRequestFullscreen) { // IE/Edge
                iframe.msRequestFullscreen();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const bannerContainer = document.getElementById('banner-container');
            const closeBanner = document.getElementById('close-banner');

            // Verifica se é a primeira visita
            if (!localStorage.getItem('bannerShown')) {
                setTimeout(() => {
                    bannerContainer.style.display = 'flex';
                }, 5000);

                // Marca que o banner já foi exibido
                localStorage.setItem('bannerShown', 'true');
            }

            // Fecha o banner de boas-vindas
            if (closeBanner) {
                closeBanner.addEventListener('click', () => {
                    bannerContainer.style.display = 'none';
                });
            }

            // Lógica do Banner Recuável do WhatsApp e Miniatura
            const waCard = document.getElementById('wa-card');
            const waMinimize = document.getElementById('wa-minimize');
            const waMini = document.getElementById('wa-mini');

            if (waMinimize && waCard && waMini) {
                // Ao clicar no X, esconde o card grande e mostra a miniatura
                waMinimize.addEventListener('click', () => {
                    waCard.classList.add('hidden');
                    waMini.classList.remove('hidden');
                });
                
                // Ao clicar na miniatura, esconde a miniatura e restaura o card
                waMini.addEventListener('click', () => {
                    waMini.classList.add('hidden');
                    waCard.classList.remove('hidden');
                });
            }
        });
    </script><script src="sc.js"></script>
